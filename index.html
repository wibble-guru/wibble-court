<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>위블 법정</title>
    <!--
      타이틀 배경을 JS 보다 먼저 요청한다. 화면 방향에 맞는 그림 하나만 받는다.
      srcset/sizes/media 는 src/data/assets.ts 의 bgSrcSet·BG_SIZES·PORTRAIT_MEDIA 와 같아야 같은 파일을 다시 쓴다
    -->
    <link
      rel="preload"
      as="image"
      media="not all and (max-aspect-ratio: 4/5)"
      href="/assets/bg/T-00_title.webp"
      imagesrcset="/assets/bg/T-00_title@1280.webp 1280w, /assets/bg/T-00_title.webp 1672w"
      imagesizes="(min-aspect-ratio: 16/9) 100vw, 177.78vh"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      media="(max-aspect-ratio: 4/5)"
      href="/assets/bg/T-00_title-portrait.webp"
      fetchpriority="high"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
